events {
    worker_connections 1;
    event_model select;
}

http {
    client_max_body_size 2M;
    error_page 404 /errors/404.html;

    server {
        listen 0.0.0.0:8080;
        root ./www/html;
        location / {
            allowed_methods GET POST;
        }
    }

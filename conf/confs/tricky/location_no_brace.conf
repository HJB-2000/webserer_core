events {
    worker_connections 1;
    event_model select;
}

http {
    client_max_body_size 1M;
    error_page 404 /errors/404.html;

    server {
        listen 127.0.0.1:8083;
        root /var/www/html;
        location /foo;  # missing '{' should fail
            allowed_methods GET;
        }
    }
}

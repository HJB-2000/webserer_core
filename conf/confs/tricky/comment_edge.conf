# Comment ending the file with double hashes and no trailing newline
# Should not create empty tokens or crash comment stripper

events {
    worker_connections 1;
    event_model select;
}

http {
    client_max_body_size 1M;
    error_page 404 /errors/404.html;

    server {
        listen 127.0.0.1:8084;
        root ./www/html;
        location / {
            allowed_methods GET;
        }
    }
}

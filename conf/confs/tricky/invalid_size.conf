events {
    worker_connections 1;
    event_model select;
}

http {
    client_max_body_size 10..1M;  # invalid size format
    error_page 404 /errors/404.html;

    server {
        listen 127.0.0.1:8081;
        root /var/www/html;
        location / {
            allowed_methods GET;
        }
    }
}

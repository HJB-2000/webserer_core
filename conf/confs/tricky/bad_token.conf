events {
    worker_connections 1;
    event_model select;
}

http {
    client_max_body_size 1M;
    error_page 404 /errors/404.html;

    server {
        listen 0.0.0.0:8082;
        root /var/www/html;
        foobar baz;  # unknown directive in server context
        location / {
            allowed_methods GET POST;
        }
    }
}

events {
    worker_connections 1;
    event_model select;
}

http {
    client_max_body_size 1M;
    error_page 404 /errors/404.html;

    server {
        listen 127.0.0.1:8080   # missing semicolon here should trigger parse error
        root /var/www/html;
        location / {
            allowed_methods GET;
        }
    }
}

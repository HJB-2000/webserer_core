events {
    worker_connections 1;
    event_model epoll;
}

events {
    worker_connections 2;
    event_model poll;
}

http {
    client_max_body_size 1M;
    server {
        listen 127.0.0.1:8080;
        server_name bad.local;
        root ./www/html;
        index index.html;
        timeout 10;
        location / { allowed_methods GET; }
    }
}

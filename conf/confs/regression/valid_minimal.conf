events {
    worker_connections 1;
    event_model epoll;
}

http {
    client_max_body_size 1M;
    error_page 404 ./errors/404.html;

    server {
        listen 127.0.0.1:8080;
        server_name example.com;
        root ./www/html;
        index index.html;
        timeout 60;

        location / {
            allowed_methods GET;
        }
    }
}

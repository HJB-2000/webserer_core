events {
    worker_connections 1;
    event_model epoll;
}

http {
    client_max_body_size 1M;
    error_page abc ./errors/abc.html;
    server {
        listen 127.0.0.1:8080;
        server_name err-alpha.local;
        root ./www/html;
        index index.html;
        timeout 10;
        location / { allowed_methods GET; }
    }
}

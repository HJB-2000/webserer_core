events {
  worker_connections 1;
  event_model select;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 1M;
  error_page 404 ./errors/404.html;
  server {
    listen 0.0.0.0:80;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout 5000;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      allowed_methods GET;
      return 404 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .php;
    }

    location /uploads/ {
      allowed_methods DELETE;
      upload_path ./www/uploads/;
    }
  }
}

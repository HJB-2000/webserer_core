events {
  worker_connections 1;
  event_model select;
}

http {
  client_max_body_size 1M;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    
    root ./www/html;
    index index.html;
    timeout 5000;

    location / {
      client_max_body_size 0;
      allowed_methods GET POST;
      allowed_methods GET;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
    }

    location /uploads/ {
      allowed_methods POST;
      upload_path ./www/uploads/;
    }


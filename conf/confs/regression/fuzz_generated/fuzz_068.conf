events {
  worker_connections 1;
  event_model poll;
}

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 0.0.0.0:80;
    
    root ./www/html;
    index index.html;
    timeout 10;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      allowed_methods GET;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
      cgi_path /bin/does-not-exist;
    }

    location /uploads/ {
      allowed_methods DELETE;
      upload_path ./www/uploads/;
    }
  }
}

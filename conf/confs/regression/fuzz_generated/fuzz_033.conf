events {
  worker_connections 1;
  event_model poll;
}

http {
  client_max_body_size 2G;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout 10;

    location / {
      client_max_body_size -1;
      allowed_methods GET POST;
      return 301 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .py;
    }

    location /uploads/ {
      allowed_methods POST;
      upload_path ./www/uploads/;
    }
  }
}

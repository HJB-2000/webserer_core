events {
  worker_connections 1;
  event_model badmodel;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 10..1M;
  error_page 404 ./errors/404.html;
  server {
    listen 0.0.0.0:80;
    server_name fuzz.local www.fuzz.local;
    root ./www/html;
    index index.html;
    timeout 60;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      allowed_methods GET;
      return 301 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
      cgi_path /usr/bin/python3;
    }

    location /uploads/ {
      allowed_methods DELETE;
      upload_path ./www/uploads/;
    }
  }
}

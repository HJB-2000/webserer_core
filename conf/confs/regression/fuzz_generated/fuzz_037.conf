events {
  worker_connections 1;
  event_model badmodel;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 127.0.0.1:http;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout abc;

    location / {
      client_max_body_size 3K;
      allowed_methods GET POST;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .php;
    }

    location /uploads/ {
      allowed_methods GET POST;
      upload_path ./www/uploads/;
    }
  }
}

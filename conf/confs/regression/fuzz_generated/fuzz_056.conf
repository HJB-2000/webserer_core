events {
  worker_connections 1;
  event_model poll;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 10..1M;
  error_page 404 ./errors/404.html;
  server {
    listen 0.0.0.0:80;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout -1;

    location / {
      client_max_body_size 0;
      allowed_methods GET POST;
      return 301 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .php;
    }

    location /uploads/ {
      allowed_methods GET POST;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

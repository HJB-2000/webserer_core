events {
  worker_connections 1;
  event_model select;
}

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 127.0.0.1:65536;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout abc;

    location / {
      client_max_body_size 0;
      allowed_methods GET POST;
      return 302 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .php;
      cgi_path /usr/bin/python3;
    }

    location /uploads/ {
      allowed_methods GET;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

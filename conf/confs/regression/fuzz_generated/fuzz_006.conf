events {
  worker_connections 1;
  event_model badmodel;
}

http {
  client_max_body_size 10..1M;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    server_name fuzz.local www.fuzz.local;
    root ./www/html;
    index index.html;
    timeout 10;

    location / {
      client_max_body_size 3K;
      allowed_methods GET POST;
      allowed_methods GET;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
      cgi_path /usr/bin/python3;
    }

    location /uploads/ {
      allowed_methods GET;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

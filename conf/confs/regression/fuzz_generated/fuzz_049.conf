events {
  worker_connections 1;
  event_model poll;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 1M;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    
    root ./www/html;
    index index.html;
    timeout 5000;

    location / {
      client_max_body_size 0;
      allowed_methods GET POST;
      return 302 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .py;
      cgi_path /usr/bin/python3;
    }

    location /uploads/ {
      allowed_methods DELETE;
      upload_path ./www/uploads/;
    }
  }
}

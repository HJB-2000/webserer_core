events {
  worker_connections 1;
  event_model poll;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    server_name fuzz.local www.fuzz.local;
    root ./www/html;
    index index.html;
    timeout abc;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      allowed_methods GET;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .py;
      cgi_path /bin/does-not-exist;
    }

    location /uploads/ {
      allowed_methods GET POST;
      upload_path ./www/uploads/;
    }
  }
}

events {
  worker_connections 1;
  event_model badmodel;
}

http {
  client_max_body_size 1M;
  error_page 404 ./errors/404.html;
  server {
    listen 0.0.0.0:80;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout abc;

    location / {
      client_max_body_size 3K;
      allowed_methods GET POST;
      return 301 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
      cgi_path /bin/does-not-exist;
    }

    location /uploads/ {
      allowed_methods GET;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

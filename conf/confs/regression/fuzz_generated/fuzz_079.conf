events {
  worker_connections 1;
  event_model badmodel;
}

http {
  client_max_body_size 1M;
  error_page 404 ./errors/404.html;
  server {
    listen 127.0.0.1:http;
    
    root ./www/html;
    index index.html;
    timeout 60;

    location / {
      client_max_body_size -1;
      allowed_methods GET POST;
      allowed_methods GET;
      return 301 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
      cgi_path /bin/does-not-exist;
    }

    location /uploads/ {
      allowed_methods POST;
      upload_path ./www/uploads/;
    }
  }
}

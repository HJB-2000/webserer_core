events {
  worker_connections 1;
  event_model select;
}

http {
  client_max_body_size 2G;
  error_page 404 ./errors/404.html;
  server {
    listen 127.0.0.1:http;
    
    root ./www/html;
    index index.html;
    timeout abc;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      allowed_methods GET;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .php;
    }

    location /uploads/ {
      allowed_methods POST;
      upload_path ./www/uploads/;
    }
  }
}

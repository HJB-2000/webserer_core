events {
  worker_connections 1;
  event_model epoll;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 127.0.0.1:8080;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout -1;

    location / {
      client_max_body_size -1;
      allowed_methods GET POST;
      return 404 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .py;
      cgi_path /usr/bin/python3;
    }

    location /uploads/ {
      allowed_methods GET;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

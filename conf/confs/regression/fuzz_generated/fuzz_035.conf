events {
  worker_connections 1;
  event_model select;
}

http {
  client_max_body_size 10..1M;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout 10;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      return 302 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext py;
    }

    location /uploads/ {
      allowed_methods DELETE;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

events {
  worker_connections 1;
  event_model poll;
}

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    server_name fuzz.local www.fuzz.local;
    root ./www/html;
    index index.html;
    timeout 60;

    location / {
      client_max_body_size 50m;
      allowed_methods GET POST;
      allowed_methods GET;
      return 302 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .php;
      cgi_path /usr/bin/python3;
    }

    location /uploads/ {
      allowed_methods POST;
      upload_path ./www/uploads/;
    }
  }
}

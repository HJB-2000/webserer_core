events {
  worker_connections 1;
  event_model badmodel;
}
events { worker_connections 2; event_model epoll; }

http {
  client_max_body_size 2G;
  error_page 404 ./errors/404.html;
  server {
    listen 99999;
    server_name fuzz.local www.fuzz.local;
    root ./www/html;
    index index.html;
    timeout 60;

    location / {
      client_max_body_size -1;
      allowed_methods GET POST;
      allowed_methods GET;
      return 301 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .py;
    }

    location /uploads/ {
      allowed_methods GET;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

events {
  worker_connections 1;
  event_model badmodel;
}

http {
  client_max_body_size 1Z;
  error_page 404 ./errors/404.html;
  server {
    listen 0.0.0.0:80;
    server_name fuzz.local;
    root ./www/html;
    index index.html;
    timeout 60;

    location / {
      client_max_body_size -1;
      allowed_methods GET POST;
      allowed_methods GET;
      return 200 /new;
    }

    location /cgi-bin/ {
      allowed_methods GET POST;
      cgi_ext .py;
    }

    location /uploads/ {
      allowed_methods POST;
      upload_path ./www/uploads/;
    }

# fuzz: intentionally unclosed blocks

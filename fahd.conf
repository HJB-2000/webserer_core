

http {
    # Global settings
    client_max_body_size 10M;
    
    # Error pages (relative to server root)
    error_page 400 ./www/html/errors/400.html;
    error_page 403 ./www/html/errors/403.html;
    error_page 404 ./www/html/errors/404.html;
    error_page 405 ./www/html/errors/405.html;
    error_page 408 ./www/html/errors/408.html;
    error_page 413 ./www/html/errors/413.html;
    error_page 500 ./www/html/errors/500.html;
    error_page 502 ./www/html/errors/502.html;
    error_page 503 ./www/html/errors/503.html;
    error_page 504 ./www/html/errors/504.html;

    server {
        listen 127.0.0.1:8080;
        # server_name webserve.com www.example.com ;
        
        # Use relative path (./) for portability across machines
        root ./www/html;
        index index.html;
        timeout 100;
        client_max_body_size 10M;  # Consistent size

        # === ROOT LOCATION ===
        location / {
            allowed_methods GET;
            autoindex off;
            index index.html;
        }

        # === DASHBOARD ===
        location /dashboard/ {
            allowed_methods GET;
            index index.html;
            autoindex off;
        }

        # === CGI BIN ===
        location /cgi-bin/ {
            allowed_methods GET POST;
            cgi_path /usr/bin/python3;
            cgi_ext .py;
            client_max_body_size 1G;  # Only for uploads
        }

        # === REDIRECTS ===
        location /redirect/ {
            allowed_methods GET;
            return 301 /new-page.html;  # Redirect to existing page
        }

        # === UPLOADS ===
        location /uploads/ {
            allowed_methods GET POST DELETE;
            upload_path ./www/html/uploads/;
            autoindex on;
        }

        # === ERROR PAGES DIRECTORY ===
        location /errors/ {
            allowed_methods GET;
            autoindex off;
        }
    }

#fahd

http {
    #Global settings
    client_max_body_size 500M;

    # Error pages (relative to server root)
    error_page 404 ./www/html/errors/400.html;
    error_page 403 ./www/html/errors/403.html;
    error_page 404 ./www/html/errors/404.html;
    error_page 405 ./www/html/errors/405.html;
    error_page 408 ./www/html/errors/408.html;
    error_page 413 ./www/html/errors/413.html;
    error_page 411 ./www/html/errors/411.html;
    error_page 500 ./www/html/errors/500.html;
    error_page 502 ./www/html/errors/502.html;
    error_page 503 ./www/html/errors/503.html;
    error_page 504 ./www/html/errors/504.html;

    server {
        listen 127.0.0.1:8080;
        server_name fahd.com ;

        # Use relative path (./) for portability across machines
        # root ./YoupiBanane;
        root ./www/html;
        index index.html;
        timeout 80;
        client_max_body_size   1000M;  # Consistent size

        # === ROOT LOCATION ===
        location / {
            allowed_methods GET DELETE;
            autoindex off;
            index index.html;
        }

        # === DASHBOARD ===
        location /dashboard/ {
            allowed_methods GET;
            index index.html;
            autoindex off;
        }

        # === CGI BIN ===
        location /cgi-bin/ {
            allowed_methods GET POST;
            cgi_path /usr/bin/python3 /usr/bin/bash;
            # cgi_path ./www/html/cgi-bin/python3;
            cgi_ext .py .sh;
            # client_max_body_size 3.5M;  # Only for uploads
        }

        # === REDIRECTS ===
        location /redirect/ {
            allowed_methods GET;
            return 301 /new-page.html;  # Redirect to existing page
            # client_max_body_size 4.5M;  # Only for uploads
        }
        # === RESTRICTED ===
        location /admin/ {
            allowed_methods DELETE;
            # client_max_body_size 5.5M;  # Only for uploads
            return 301 /new-page.html;  # Redirect to existing page
        }
        # === UPLOADS ===
        location /uploads/ {
            allowed_methods GET POST DELETE;
            # upload_path ./www/html/uploads/;
            upload_path ./www/html/uploads/;
            autoindex on;
            # client_max_body_size 6.5M;  # Only for uploads
        }

        # === ERROR PAGES DIRECTORY ===
        location /errors/ {
            allowed_methods GET;
            autoindex off;
        }
    }


    server {
            listen 127.0.0.1:9090;
            server_name fahd.com ;

            # Use relative path (./) for portability across machines
            # root ./YoupiBanane;
            root ./www/html;
            index index.html;
            timeout 30;
            client_max_body_size   1000M;  # Consistent size

            # === ROOT LOCATION ===
            location / {
                allowed_methods GET DELETE;
                autoindex off;
                index index.html;
            }

            # === DASHBOARD ===
            location /dashboard/ {
                allowed_methods GET;
                index index.html;
                autoindex off;
            }

            # === CGI BIN ===
            location /cgi-bin/ {
                allowed_methods GET POST;
                cgi_path /usr/bin/python3 /usr/bin/bash;
                # cgi_path ./www/html/cgi-bin/python3;
                cgi_ext .py .sh;
                client_max_body_size 1M;  # Only for uploads
            }

            # === REDIRECTS ===
            location /redirect/ {
                allowed_methods GET;
                return 301 /new-page.html;  # Redirect to existing page
                # client_max_body_size 4.5M;  # Only for uploads
            }
            # === RESTRICTED ===
            location /admin/ {
                allowed_methods DELETE;
                # client_max_body_size 5.5M;  # Only for uploads
                return 301 /new-page.html;  # Redirect to existing page
            }
            # === UPLOADS ===
            location /uploads/ {
                allowed_methods GET POST DELETE;
                # upload_path ./www/html/uploads/;
                upload_path ./www/html/uploads/;
                autoindex on;
                # client_max_body_size 6.5M;  # Only for uploads
            }

            # === ERROR PAGES DIRECTORY ===
            location /errors/ {
                allowed_methods GET;
                autoindex off;
            }
        }

    }
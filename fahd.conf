            autoindex off;
        }

        # === CGI BIN ===
        location /cgi-bin/ {
            allowed_methods GET POST;
            cgi_path ./www/html/cgi-bin/python3.13; # relative here
            cgi_ext .py;
            # client_max_body_size 3.5M;  # Only for uploads
        }

        # === REDIRECTS ===
        location /redirect/ {
            allowed_methods GET;
            return 301 /new-page.html;  # Redirect to existing page
            # client_max_body_size 4.5M;  # Only for uploads
        }
        # === RESTRICTED ===
        location /admin/ {
            allowed_methods DELETE;
            # client_max_body_size 5.5M;  # Only for uploads
            return 301 /new-page.html;  # Redirect to existing page
        }
        # === UPLOADS ===
        location /uploads/ {
            allowed_methods GET POST DELETE;
            # upload_path ./www/html/uploads/;
            upload_path ./www/html/uploads/;
            autoindex on;
            # client_max_body_size 6.5M;  # Only for uploads
        }

        # === ERROR PAGES DIRECTORY ===
        location /errors/ {
            allowed_methods GET;
            autoindex off;
        }
    }
}
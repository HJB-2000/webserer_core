<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>413 - Payload Too Large</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 10px;
            border-left: 4px solid #f59e0b;
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 80px;
            color: #f59e0b;
            margin: 0;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        .file-info {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>413</h1>
        <h2>Payload Too Large</h2>
        <p>The file you're trying to upload exceeds the maximum allowed size.</p>
        <div class="file-info">
            <strong>🔧 Technical Details:</strong><br>
            • Limit is set in webserv config (client_max_body_size)<br>
        </div>
        <br>
        <a href="/dashboard/index.html">← Back to Dashboard</a>
    </div>
</body>
</html>

#Youpi

http {
    #Global settings
    client_max_body_size 1048576;

    server {
        listen localhost:8080;
        server_name youpi;
        timeout 140;


        root ./YoupiBanane;
        index index.html;

        location / {
            allowed_methods GET;
            index index.html;
        }

        location /post_body {
            allowed_methods POST;
            client_max_body_size 100M;
        }

        location /directory/ {
            allowed_methods GET;
            root ./YoupiBanane;
            index youpi.bad_extension;
        }

        location /youpi.bla/ {
            allowed_methods POST;
            cgi_path ./cgi_test;
            cgi_ext .bla;
        }

        location /directory/youpi.bla {
            allowed_methods POST;
            root ./YoupiBanane;
            cgi_path ./cgi_test;
            cgi_ext .bla;
        }
    }
}
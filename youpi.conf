http {
            client_max_body_size 999M;


    server {
            client_max_body_size 999M;

        listen 5500;
        server_name localhost;
        timeout 30;

        root /home/fahd/hands/webserer_core;
        index index.html;

        location / {
            allowed_methods GET;
            autoindex on;
        }

        location /post_body {
            allowed_methods POST;
            upload_path  /home/fahd/hands/webserer_core/post_body;
            client_max_body_size 100;
        }

        location /directory/ {
            client_max_body_size 999M;

            allowed_methods GET;
            root /home/fahd/hands/webserer_core/directory;
            index youpi.bad_extension;
        }

        location /directory/youpi.bla {
            allowed_methods GET POST;
            root /home/fahd/hands/webserer_core/directory;
            cgi_path /home/fahd/hands/webserer_core/cgi_test;
            cgi_ext .bla;
            client_max_body_size 999M;
        }

        location /directory/youpla.bla {
            allowed_methods GET POST;
            root /home/fahd/hands/webserer_core/directory;
            cgi_path /home/fahd/hands/webserer_core/cgi_test;
            cgi_ext .bla;
            client_max_body_size 999M;
        }

    }

}